[package]
name = "smolnet_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[features]
fuzzing = []

[dependencies]
rustler = "=0.38.0"
# Vendored with a loss-recovery patch; see docs/adr/0013. A direct path
# dependency, not a [patch], so Rustler rebuilds the NIF when it changes.
smoltcp = { path = "../vendor/smoltcp", version = "=0.14.0", default-features = false, features = [
  "std",
  "medium-ip",
  "proto-ipv4",
  "proto-ipv6",
  "auto-icmp-echo-reply",
  "async",
  "iface-max-addr-count-8",
  "socket-tcp",
  # Every TCP socket runs CUBIC congestion control (RFC 9438), as Linux's
  # do by default; see docs/adr/0013.
  "socket-tcp-cubic",
  "socket-udp",
  # A TCP receiver holds up to 32 ranges of out-of-order data, not 4: past
  # the last it drops a segment, so a path that reorders a window turns
  # into losses (#168, #117).
  "assembler-max-segment-count-32",
] }
