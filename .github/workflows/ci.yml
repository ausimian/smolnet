name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.os }} / Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, elixir: "1.20", otp: "29"}
          - {os: ubuntu-24.04, elixir: "1.20", otp: "28"}
          - {os: ubuntu-24.04, elixir: "1.20", otp: "27"}
          - {os: ubuntu-24.04, elixir: "1.19", otp: "28"}
          - {os: ubuntu-24.04, elixir: "1.19", otp: "27"}
          - {os: ubuntu-24.04, elixir: "1.18", otp: "27"}
          - {os: macos-15, elixir: "1.20", otp: "29"}
          - {os: macos-15, elixir: "1.20", otp: "28"}
          - {os: macos-15, elixir: "1.20", otp: "27"}
          - {os: macos-15, elixir: "1.19", otp: "28"}
          - {os: macos-15, elixir: "1.19", otp: "27"}
          - {os: macos-15, elixir: "1.18", otp: "27"}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native -> target

      # Keep project build artifacts fresh so Rustler always copies the NIF
      # into priv/native during compilation.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps
          key: >-
            mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-
            ${{ hashFiles('mix.lock', 'native/Cargo.lock') }}

      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test --warnings-as-errors

  quality:
    name: precommit / coverage / package
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.3"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native -> target

      # Keep project build artifacts fresh so Rustler always copies the NIF
      # into priv/native during compilation.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            priv/plts
          key: >-
            quality-${{ runner.os }}-1.19.5-28.3-
            ${{ hashFiles('mix.lock', 'native/Cargo.lock') }}

      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - run: mix precommit
        env:
          # Enforce the full-call p99 while retaining the maximum as evidence;
          # host preemption makes a shared-runner maximum unsuitable as a gate.
          SMOLNET_NIF_WALL_CLOCK_MODE: p99
      - run: mix coveralls.cobertura
      - run: mix hex.build

  native-budget:
    name: native budget / ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04-arm, architecture: linux-aarch64}
          - {os: macos-15, architecture: macos-source}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.3"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.94.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native -> target

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps
          key: >-
            budget-${{ runner.os }}-${{ runner.arch }}-1.19.5-28.3-
            ${{ hashFiles('mix.lock', 'native/Cargo.lock') }}

      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix run scripts/nif_budget.exs
        env:
          SMOLNET_NIF_WALL_CLOCK_MODE: p99

  native-safety:
    name: native safety / ASan fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.3"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # nightly
        with:
          toolchain: nightly-2026-09-01

      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: >-
          cargo +nightly-2026-09-01 test
          --manifest-path native/Cargo.toml
          --package smolnet_core
          --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: -Zsanitizer=address
      - run: cargo +nightly-2026-09-01 fuzz run raw_packets -- -runs=10000
        working-directory: native/fuzz
      - run: cargo +nightly-2026-09-01 fuzz run endpoint_options -- -runs=10000
        working-directory: native/fuzz
      - run: cargo +nightly-2026-09-01 fuzz run socket_operations -- -runs=10000
        working-directory: native/fuzz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: fuzz-crashes
          path: native/fuzz/artifacts
          if-no-files-found: ignore
